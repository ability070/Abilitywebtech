<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Matches your website's primary blue gradient -->
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#brand-gradient)" />
  
  <!-- Bold 'ABN' Typography -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="220" fill="#ffffff" letter-spacing="-10">ABN</text>
  
  <!-- Cyber/Tech Accent Dot (Matches your banner's yellow highlight) -->
  <circle cx="420" cy="90" r="30" fill="#fcd34d" />
</svg>